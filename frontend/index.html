<style>
:root{font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#16253b;background:#f7f9fc;font-size:15px}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:#1764bd;text-decoration:none}a:hover{text-decoration:underline}
header{background:#fff;border-bottom:1px solid #e0e6ed;padding:20px max(20px,calc((100vw - 1240px)/2))}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand h1{margin:0;font-size:23px;letter-spacing:-.5px}.brand p{margin:6px 0 0;color:#68778a;font-size:14px}
.status{font-size:13px;font-weight:700;border:1px solid #efca81;color:#875a00;border-radius:20px;padding:8px 12px;background:#fff9ea}
.shell{max-width:1280px;margin:auto;padding:22px 18px 65px}
.topline{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.title h2{font-size:22px;margin:0 0 5px}.title p{margin:0;color:#68778a;font-size:14px}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #cfd9e7;border-radius:13px;padding:0 15px;min-height:52px;box-shadow:0 3px 12px #19345206;width:min(480px,100%)}
.searchbar:focus-within{outline:2px solid #c5ddfa;border-color:#5d9ee4}.searchbar span{font-size:20px;color:#6e829b}
.searchbar input{border:0;outline:0;width:100%;background:transparent;min-width:0;color:#203853;font-size:15px}
.layout{display:grid;grid-template-columns:minmax(290px,350px) minmax(0,1fr);gap:18px;align-items:start}
.sidebar,.reader{background:#fff;border:1px solid #e0e6ef;border-radius:16px;min-width:0;box-shadow:0 3px 18px #24374e08}
.controls{padding:16px;border-bottom:1px solid #e9edf3}.tabs{display:flex;gap:6px;background:#f0f4f9;border-radius:11px;padding:5px}.tabs button{flex:1;border:0;background:transparent;border-radius:8px;color:#52657b;padding:9px 6px;font-size:14px;white-space:nowrap}.tabs button.active{color:#124a8c;background:white;box-shadow:0 1px 5px #1b365422;font-weight:700}
.count{font-size:13px;margin:13px 2px 0;color:#738298}.results{max-height:72vh;overflow:auto}
.result{display:block;width:100%;text-align:right;border:0;border-bottom:1px solid #edf1f5;background:#fff;padding:15px 17px;line-height:1.7;color:#213750}
.result:hover{background:#f5f9ff}.result.active{background:#eaf4ff;border-right:3px solid #3179c8}
.result .number{direction:ltr;display:inline-block;font-size:12px;color:#2674c4;font-weight:700;background:#edf5ff;border-radius:5px;padding:1px 6px;margin-left:6px}
.result .label{font-size:14px;font-weight:700}.result .excerpt{display:block;font-size:12.5px;color:#798699;line-height:1.8;margin-top:7px}
.empty{padding:23px;color:#6d7e92;line-height:2}
.more{display:block;width:calc(100% - 28px);margin:14px;border:1px solid #cbd8e8;color:#315f96;border-radius:9px;background:#f6faff;padding:11px}
.reader{min-height:420px;padding:29px 34px}
.breadcrumb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#8190a4;font-size:13px;margin-bottom:23px}.breadcrumb button{border:0;background:none;color:#4976a7;padding:0;cursor:pointer;font-size:13px}
.doc-heading{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}.doc-heading h3{font-size:25px;font-weight:750;margin:0;line-height:1.7}.doc-id{direction:ltr;display:inline-block;background:#edf4fc;color:#27609c;padding:5px 10px;font-size:13px;border-radius:8px;font-weight:700}
.section-body{font-size:16px;line-height:2.35;text-align:justify;margin-top:27px;color:#233247;white-space:pre-wrap;overflow-wrap:anywhere}
.no-body{padding:18px;background:#f6f9fc;border-radius:11px;color:#65788f;margin-top:24px;line-height:2}
.source{border-top:1px solid #e9edf3;margin-top:35px;padding-top:18px}.source h4{font-size:14px;margin:0 0 12px}.page-links{display:flex;flex-wrap:wrap;gap:8px}.page-links a{display:inline-flex;align-items:center;border:1px solid #d5e4f5;background:#f7fbff;padding:8px 11px;border-radius:8px;font-size:13px}
.detail{margin-top:12px;font-size:12px;color:#8591a0;line-height:1.9}
.audit{margin-top:22px;padding:18px 20px;border:1px solid #ead9ae;background:#fffaf0;border-radius:13px;color:#725a2d;line-height:2;font-size:14px}
.audit strong{color:#70511a}.audit h4{margin:0 0 7px;font-size:16px}.audit p{margin:0}
.stats{display:flex;gap:15px;flex-wrap:wrap;margin-top:14px}.stat{background:#fff;border-radius:10px;border:1px solid #eadfbf;padding:10px 14px;min-width:120px}.stat b{display:block;color:#374b62;font-size:20px}.stat small{font-size:12px;color:#7a8490}
details{margin-top:15px}summary{cursor:pointer;color:#3e637b;font-weight:700}.page-audit{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px;max-height:240px;overflow:auto}
.page-audit a{background:#fff;border:1px solid #e4e6ec;border-radius:7px;text-align:center;font-size:12px;padding:7px;color:#48677a}
#failure{display:none;color:#9a351d;background:#fff4ee;border:1px solid #f3c1ad;padding:17px;border-radius:12px;line-height:1.9}
@media(max-width:760px){.layout{grid-template-columns:1fr}.results{max-height:260px}.reader{padding:20px}.doc-heading h3{font-size:21px}.section-body{font-size:15px}.topline{align-items:stretch}.searchbar{width:100%}.shell{padding:16px 12px 45px}header{padding:17px 15px}.brand h1{font-size:19px}}

/* Reader refinement: headings belong to the hierarchy, not to search results. */
.result{display:block;padding:0;border-right:3px solid transparent}.result.active{border-right-color:#3179c8}
.result-main{display:block;width:100%;text-align:right;padding:13px 16px 5px;border:0;background:transparent;color:inherit;line-height:1.8}
.result-main:hover{background:#f4f9ff}.result .excerpt{font-size:13px;line-height:1.9;margin-top:5px}
.result .context{display:block;color:#6b7d92;font-size:13px;margin:4px 0 0;line-height:1.6}
.result .number{font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.result .tags{padding:0 17px 13px}
.tag{font-size:13px;border:1px solid #d7e6f3;background:#f1f7fd;color:#2d6698;border-radius:22px;line-height:1.65;padding:4px 10px}
.tag:hover,.tag:focus-visible{background:#dceeff;border-color:#86b7e2;outline:none}
.result .tag{font-size:13px;padding:2px 9px;background:#f6f9fc;border-color:#e0e9f3;color:#567492}
.tag-panel{margin-top:22px;padding:16px 17px;border:1px solid #e0eaf4;border-radius:12px;background:#f9fbfe}
.tag-panel h4{margin:0 0 12px;font-size:14px;color:#425c77}
.breadcrumb .crumb{color:#4a6f95;border-bottom:1px dashed #c5d6e9}
.searchbar{position:relative}.searchbar input{font-size:16px}
.clear-search{border:0;background:transparent;font-size:19px;color:#7b8ca3;padding:5px;min-width:30px}
.clear-search:hover{color:#225f9e}
.doc-heading h3{font-size:23px}
.chapter-context{font-size:14px;color:#637e9a;margin-bottom:8px}

<body>
<header>
 <div class="brand"><div><h1>مقررات ملی ساختمان</h1><p>نمایش آزمایشی داده‌های استخراج‌شده · مبحث اول</p></div><span class="status">در انتظار تطبیق نهایی با PDF</span></div>
</header>
<main class="shell">
 <div class="topline"><div class="title"><h2>مبحث ۱ — تعاریف</h2><p>ویرایش ۱۳۹۲ · مشاهدهٔ بندهای واقعی و ترتیب اصلی کتاب</p></div>
 <label class="searchbar"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="جستجوی اصطلاح، موضوع یا شماره بند..." autocomplete="off" aria-label="جستجو در مبحث اول"></label></div>
 <div id="failure" role="alert"></div>
 <div class="layout" id="layout" style="display:none">
  <aside class="sidebar" aria-label="فهرست بندها">
   <div class="controls"><div class="tabs" role="group" aria-label="دسته‌بندی"><button type="button" data-view="all" class="active">همه</button><button type="button" data-view="1-1">کلیات</button><button type="button" data-view="1-2">تعاریف</button></div><p class="count" id="count"></p></div>
   <div class="results" id="results"></div>
  </aside>
  <article class="reader" id="reader" aria-live="polite"></article>
 </div>
 <section class="audit" id="audit"><h4>گزارش انتقال از PDF</h4><p>در حال خواندن گزارش پوشش...</p></section>
</main>
<script>
(function(){
 "use strict";
 var state={sections:[],byId:new Map(),coverage:null,query:"",view:"all",shown:40,selected:null};
 var element=function(id){return document.getElementById(id)};
 function clean(x){return String(x==null?"":x).normalize("NFKC").replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/[ًٌٍَُِّْـ]/g,"").replace(/[\u200c\u200d]/g," ").replace(/\s+/g," ").trim().toLowerCase()}
 function digits(x){return String(x).replace(/[۰-۹]/g,function(c){return "۰۱۲۳۴۵۶۷۸۹".indexOf(c)}).replace(/[٠-٩]/g,function(c){return "٠١٢٣٤٥٦٧٨٩".indexOf(c)})}
 function safe(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

 var stopWords=new Set("است هست هستند بوده باشد میشود میشوند میگردد میگردند میتوان میباشد میباشند دارد دارند برای دارای در از به با بر را آن این آنها آنرا که یا و همچنین ضمن توسط تحت مورد صورت جهت طور عبارت شامل نظیر مانند یعنی معمولاً معمولا شده شوند شدن میتواند میتوانند میکند میکنند نمود نماید نمایند باید طبق بعضی برخی هر یک دو سه چهار سایر کلیه تمام بین براساس زیرا مربوط برای براساس است که شده میباشد درون خود نیز هنگامی محل وجود کار اعمال استفاده ساختمان ساختمانها ساختمانهای مقررات مبحث ملی مباحث موضوع اصلی تعریف تعاریف کلیات دامنه کاربرد داده است".split(" "));
 function parentOf(s){return s.parent_id?state.byId.get(s.parent_id):null}
 function contextName(s){var p=parentOf(s);return p?p.title:""}
 function shownContext(s){var p=parentOf(s);return p&&p.number!=="1-2"?p.title:""}
 function hasBody(s){return Boolean((s.text||"").trim())}
 function sameGroup(s){return state.view==="all" || s.number===state.view || s.number.indexOf(state.view+"-")===0}
 function matched(s){if(!hasBody(s)||!sameGroup(s))return false;if(!state.query)return true;var parts=clean(digits(state.query)).split(" ").filter(Boolean);var source=clean(s.number+" "+s.title+" "+contextName(s)+" "+s.text);return parts.every(function(p){return source.indexOf(p)!==-1})}
 function score(s){var q=clean(digits(state.query)), t=clean(s.title), n=clean(s.number);if(!q)return 0;if(n===q)return 100;if(n.indexOf(q)===0)return 60;if(t===q)return 45;if(t.indexOf(q)!==-1)return 30;return 10}
 function filtered(){var list=state.sections.filter(matched);if(state.query)list.sort(function(a,b){return score(b)-score(a)||a.order-b.order});return list}
 function short(s){var t=(s.text||"").replace(/\s+/g," ").trim();var n=clean(digits(state.query));if(n){var i=clean(t).indexOf(n);if(i>70)t="…"+t.slice(Math.max(0,i-22))}return t.slice(0,125)+(t.length>125?"…":"")}
 function titleWords(s){return clean(s.title).replace(/[۰-۹0-9()（）،.:؛»«\-]/g," ").split(/\s+/).filter(function(t){return t.length>2&&!stopWords.has(t)})}

 var tagStop=new Set("آنها اینها دیگر مختلفی متشکل اجزا وسیلهای سازی طرح اجرای مقابل مسئول مسیر حرکت وسیلههایی اشاره کلیه معمولی اصولی چنین انجام نتیجه صورت مورد استفاده مربوط مرتبط گردیده میگردد میباشد ساختمان است شده استفاده موجب برخی برابر نقش هنگام موضوع محدوده مقدار ایجاد وضعیت تعداد نوع میشود باشد میشوند بخشها روشهای معمولاً زمانی امکان دارای وجود بستگی فقط وگرنه ضرورت ویژگیها مجموعههای بیشتر کمتر اساس ابتدا توسعه تمام جدید نخستین لازم طریق بیشتر شود شکل نشان میدهد میدهند وارد ارائه تعیین".split(" "));
 function tagCandidates(s){var title=clean(s.title).replace(/[\u0660-\u0669۰-۹0-9()（）:؛]/g," ").replace(/\s+/g," ").trim(),words=titleWords(s),tags=[];
 function push(t){t=String(t).trim();if(t.length<3||tagStop.has(clean(t))||tags.some(function(a){return clean(a)===clean(t)}))return;tags.push(t)}
 if(words.length&&title.length<58)push(title);
 words.forEach(push);
 if(!words.length){var topic=contextName(s).replace(/^مبحث\s+[^:：]+[:：]\s*/,"").trim();if(topic.length>3){push(topic);clean(topic).split(/\s+/).filter(function(w){return w.length>2&&!stopWords.has(w)}).forEach(push)}}
 var body=clean(s.text),bodyTokens=body.replace(/[۰-۹0-9()（）:؛.،»«\-،\/]/g," ").split(/\s+/).filter(Boolean),first={};
 bodyTokens.forEach(function(w,i){if(first[w]===undefined)first[w]=i});
 var glossary=(s.search_terms||[]).map(clean).filter(function(w){return w.length>=4&&state.glossaryTokens.has(w)&&!stopWords.has(w)&&!tagStop.has(w)&&(state.df[w]||0)<=24&&first[w]!==undefined});
 glossary.sort(function(a,b){return first[a]/30+(state.df[a]||1)*.3 - (first[b]/30+(state.df[b]||1)*.3)});
 glossary.forEach(function(t){if(tags.length<5)push(t)});
 if(tags.length<4){var rare=(s.search_terms||[]).map(clean).filter(function(w){return w.length>=5&&(state.df[w]||0)<=8&&first[w]!==undefined&&!stopWords.has(w)&&!tagStop.has(w)&&!words.some(function(x){return w!==x&&w.indexOf(x)===0})}).sort(function(a,b){return (state.df[a]||0)*.5+first[a]/40-(a.length*.15)-((state.df[b]||0)*.5+first[b]/40-(b.length*.15))});rare.forEach(function(t){if(tags.length<5)push(t)})}
 return tags.slice(0,5)}
 function tagsHtml(s,limit){return '<div class="tags">'+tagCandidates(s).slice(0,limit).map(function(t){return '<button type="button" class="tag" data-tag="'+safe(t)+'" title="جستجو با این برچسب">'+safe(t)+'</button>'}).join("")+'</div>'}
 function resultItem(s){var parent=shownContext(s);return '<div class="result'+(s.id===state.selected?" active":"")+'"><button type="button" class="result-main" data-id="'+safe(s.id)+'"><span class="number">'+safe(s.number)+'</span><span class="label">'+safe(s.title)+'</span>'+(parent?'<span class="context">'+safe(parent)+'</span>':"")+'<span class="excerpt">'+safe(short(s))+'</span></button>'+tagsHtml(s,2)+'</div>'}
 function renderResults(){var list=filtered();var limit=state.shown;element("count").textContent=digits(list.length).replace(/[0-9]/g,function(c){return "۰۱۲۳۴۵۶۷۸۹"[+c]})+" بند دارای متن"+(state.query?" مرتبط با جستجو":"");element("results").innerHTML=list.length?list.slice(0,limit).map(resultItem).join("")+(list.length>limit?'<button type="button" class="more" id="more">نمایش موارد بیشتر</button>':""):'<div class="empty">موردی با این عبارت در این بخش پیدا نشد.</div>'}
 function choose(id){var s=state.byId.get(id);if(!s||!hasBody(s))return;state.selected=id;try{history.replaceState(null,"","#"+encodeURIComponent(id))}catch(e){};renderReader();renderResults()}
 function syncSelection(){var list=filtered();if(!list.some(function(s){return s.id===state.selected})){state.selected=list.length?list[0].id:null;if(state.selected){try{history.replaceState(null,"","#"+encodeURIComponent(state.selected))}catch(e){}}}renderResults();renderReader()}
 function applyTag(tag){state.query=tag;state.view="all";state.shown=40;element("search").value=tag;document.querySelectorAll("[data-view]").forEach(function(x){x.classList.toggle("active",x.dataset.view==="all")});syncSelection();element("search").focus()}
 function breadcrumbs(s){var arr=[],cursor=s,guard=0;while(cursor&&cursor.parent_id&&guard<12){cursor=state.byId.get(cursor.parent_id);if(cursor)arr.push(cursor);guard++}return arr.reverse().map(function(p){return '<span class="crumb">'+safe(p.number+" · "+p.title)+'</span><span>›</span>'}).join("")}
 function renderReader(){var s=state.byId.get(state.selected);if(!s){element("reader").innerHTML='<p class="empty">بندی با این جستجو پیدا نشد. عبارت دیگری وارد کنید.</p>';return}var pages=(s.page_segments||[]).map(function(p){return p.pdf_page}).filter(function(p,i,a){return a.indexOf(p)===i});var url=state.doc&&state.doc.pdf_url||"";var links=pages.map(function(p){return '<a href="'+safe(url+"#page="+p)+'" target="_blank" rel="noopener noreferrer">صفحه '+safe(String(p))+' PDF ↗</a>'}).join("");var body=(s.text||"").trim();var assets=s.assets||[];var media=assets.map(function(a){return '<figure><img alt="'+safe(a.caption||a.type||"شکل مربوط به بند")+'" loading="lazy" src="'+safe(a.file)+'"><figcaption>'+safe(a.caption||"")+'</figcaption></figure>'}).join("");var parent=shownContext(s);element("reader").innerHTML='<nav class="breadcrumb" aria-label="مسیر بند">'+breadcrumbs(s)+'</nav>'+(parent?'<div class="chapter-context">'+safe(parent)+'</div>':"")+'<div class="doc-heading"><h3>'+safe(s.title)+'</h3><span class="doc-id">'+safe(s.number)+'</span></div><div class="section-body">'+safe(body)+'</div>'+media+'<div class="tag-panel"><h4>برچسب‌های جستجو · استخراج‌شده از عنوان و متن</h4>'+tagsHtml(s,7)+'</div><div class="source"><h4>ارجاع به منبع اصلی</h4><div class="page-links">'+links+'</div><div class="detail">متن به صورت ماشینی استخراج شده و بازبینی تطبیقی تمام واژه‌ها و علائم نگارشی هنوز نهایی نشده است.</div></div>'}
 function renderAudit(){var c=state.coverage;if(!c)return;var sum=c.pages.reduce(function(v,p){return v+(p.content_lines||0)},0),done=c.pages.reduce(function(v,p){return v+(p.assigned_lines||0)},0),pct=sum?Math.round(done/sum*100):0;var p=(c.pages||[]).map(function(x){return '<a href="'+safe(state.doc.pdf_url+"#page="+x.pdf_page)+'" target="_blank" rel="noopener noreferrer">PDF '+x.pdf_page+' · '+x.assigned_lines+'/'+x.content_lines+' خط</a>'}).join("");element("audit").innerHTML='<h4>گزارش پوشش مبحث اول</h4><p>این عددها پوشش <strong>ساختاری استخراج</strong> را نشان می‌دهند، نه تأیید صحت تک‌تک کلمات. بررسی نهایی در برابر تصویر PDF هنوز انجام نشده است.</p><div class="stats"><div class="stat"><b>'+state.sections.filter(hasBody).length+'</b><small>بند دارای متن</small></div><div class="stat"><b>'+state.sections.filter(function(s){return !hasBody(s)}).length+'</b><small>عنوان ساختاری (غیرقابل جستجو)</small></div><div class="stat"><b>'+c.definitions_indexed+'</b><small>تعریف</small></div><div class="stat"><b>'+c.unique_content_pages.length+'</b><small>صفحه محتوای یکتا</small></div><div class="stat"><b>'+pct+'٪</b><small>خطوط تخصیص‌یافته</small></div><div class="stat"><b>'+c.assets_linked+'</b><small>تصویر (در این مبحث شناسایی نشده)</small></div></div><details><summary>نمایش وضعیت انتقال تمام صفحات محتوا</summary><p>۱۰ صفحهٔ مقدماتی کنار گذاشته شده و ۵۶ صفحهٔ پایانی فایل تکرار صفحات قبلی هستند. هر لینک صفحهٔ متناظر PDF را باز می‌کند.</p><div class="page-audit">'+p+'</div></details>'}

 document.querySelectorAll("[data-view]").forEach(function(b){b.addEventListener("click",function(){state.view=b.dataset.view;state.shown=40;document.querySelectorAll("[data-view]").forEach(function(x){x.classList.toggle("active",x===b)});syncSelection()})});
