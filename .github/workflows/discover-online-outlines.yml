name: Discover text-first online outlines

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/discover_online_outlines.py"
      - ".github/workflows/discover-online-outlines.yml"
      - "sources/text-source-inventory.json"

permissions:
  contents: write

concurrency:
  group: text-first-online-outlines
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML reader (no OCR)
        run: python3 -m pip install requests beautifulsoup4
      - name: Scan 24-chapter online table-of-contents sources
        run: python3 -u scripts/discover_online_outlines.py
      - name: Verify source inventory
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('frontend/data/text-phase1/online-outlines.json').read_text())
          assert len(x['chapters'])==24
          assert x['summary']['no_ocr']
          assert not x['summary']['full_text_imported_from_these_sources']
          print(x['summary'])
          PY
      - name: Commit evidence-based TOC inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/data/text-phase1/online-outlines.json
          if ! git diff --staged --quiet; then
            git commit -m "Update text-first online outline source inventory"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
