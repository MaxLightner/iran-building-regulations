name: Inspect chapter 4 PDF structure
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-m04.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'pymupdf>=1.24,<1.28'
      - run: python3 scripts/inspect_m04.py
      - name: Record inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/analysis/m04-inspection.json
          git diff --cached --quiet || (git commit -m 'Record m04 PDF layout inspection' && git push)
