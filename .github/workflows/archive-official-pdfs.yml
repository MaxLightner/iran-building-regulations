name: Archive official regulation PDFs (private)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/archive-official-pdfs.yml"

permissions:
  contents: write

concurrency:
  group: archive-official-pdfs-main
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'MaxLightner/iran-building-regulations' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download PDF files from official inbr.ir links only
        run: python3 scripts/download_official_pdfs.py
      - name: Try unverified secondary reference PDFs for private comparison
        run: python3 scripts/download_reference_mirrors.py
      - name: Commit downloaded PDFs and factual reports
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if compgen -G "sources/pdfs/*.pdf" > /dev/null; then
            git add -f -- sources/pdfs/*.pdf
          fi
          git add -- sources/manifest.json sources/pdf-download-report.json sources/reference-mirror-report.json
          if ! git diff --staged --quiet; then
            git commit -m "Archive reachable official PDFs and report download failures [skip ci]"
            git push origin HEAD:main
          else
            echo "Nothing to commit"
          fi
