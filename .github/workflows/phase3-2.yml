name: Phase 3-2 full OCR and searchable index, chapters 6 7 9 10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-2.yml"

permissions:
  contents: write

concurrency:
  group: phase3-2-main
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install PDF and Persian OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fas tesseract-ocr-eng
          python3 -m pip install 'pymupdf>=1.24,<1.28'
      - name: Extract all pages of 6, 7, 9, 10
        run: python3 -u scripts/extract_batch_pages.py --chapters 6 7 9 10
      - name: Rebuild all page-search indexes
        run: |
          python3 scripts/build_static.py
          python3 scripts/build_draft_index.py
      - name: Check provenance, full-page coverage and browser search
        run: |
          python3 -m unittest discover -s tests -p 'test_phase3_2.py' -v
          python3 -m unittest discover -s tests -p 'test_draft_index.py' -v
          node --check frontend/app.js
          node tests/draft-search.test.cjs
      - name: Commit finished batch to repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/extracted/m06/pages data/extracted/m07/pages data/extracted/m09/pages data/extracted/m10/pages
          git add data/analysis/m06-quality.json data/analysis/m07-quality.json data/analysis/m09-quality.json data/analysis/m10-quality.json
          git add frontend/data/
          if ! git diff --staged --quiet; then
            git commit -m "Phase 3-2: searchable chapter 6 7 9 10 text with page provenance [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Do not deploy Pages during batch extraction
        run: echo "No deployment requested. GitHub Pages release stays deferred."
