name: Finalize phase 3 from completed OCR artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-finalize.yml"

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download successful OCR artifacts from completed all-chapter run
        uses: actions/download-artifact@v4
        with:
          pattern: phase3-*
          path: merged
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 40905065527
      - name: Restore extracted chapter data
        run: |
          cp -a merged/data/extracted/. data/extracted/
          cp -a merged/data/analysis/. data/analysis/
      - name: Build complete 24-chapter indexes and structured knowledge
        run: |
          python3 scripts/build_static.py
          python3 scripts/build_draft_index.py
          python3 scripts/build_knowledge.py
      - name: Run final phase-3 acceptance suite
        run: |
          python3 -m unittest discover -s tests -p 'test_all24.py' -v
          python3 -m unittest discover -s tests -p 'test_draft_index.py' -v
          python3 -m unittest discover -s tests -p 'test_knowledge.py' -v
          node --check frontend/app.js
          node tests/draft-search.test.cjs
          node tests/knowledge-search.test.cjs
      - name: Commit complete corpus and knowledge index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/extracted/ data/analysis/ frontend/data/
          if ! git diff --staged --quiet; then
            git commit -m "Complete phase 3: all 24 chapters as searchable structured knowledge [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Keep Pages publication deferred
        run: echo "Phase 3 corpus committed. GitHub Pages deployment remains deferred."
