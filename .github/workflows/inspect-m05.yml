name: Inspect Chapter 5 clause numbering
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/inspect_m05_layout.py",".github/workflows/inspect-m05.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q pymupdf requests
      - run: python3 scripts/inspect_m05_layout.py
