name: Archive and parse m04 security appendix 1403
on:
  push:
    branches: [main]
    paths: [".github/workflows/m04-security.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-fas tesseract-ocr-eng
      - run: python3 -m pip install 'pymupdf>=1.24,<1.28'
      - run: python3 scripts/extract_m04_security.py
      - name: Commit appendix source and extracted text (not Pages)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f sources/pdfs/m04-security-1403.pdf
          git add data/extracted/m04-security-1403/pages data/records/m04-security-1403.json data/analysis/m04-security-quality.json
          git diff --cached --quiet || (git commit -m 'Archive chapter 4 security appendix and pending-review extraction [skip ci]' && git push)
