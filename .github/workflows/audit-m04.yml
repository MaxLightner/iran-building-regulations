name: Audit m04 extraction and create review queue
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-m04.yml", "scripts/audit_m04.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit both chapters and appendix
        run: python3 scripts/audit_m04.py
      - name: Commit review checklist and QC summary only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/analysis/m04-review-queue.json data/analysis/m04-audit-summary.json
          git diff --cached --quiet || (git commit -m 'Create m04 review queue with numeric and conditional risk flags [skip ci]' && git push)
