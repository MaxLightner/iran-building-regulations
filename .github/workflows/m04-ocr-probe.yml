name: OCR quality probe m04
on:
  push:
    branches: [main]
    paths: [".github/workflows/m04-ocr-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-fas tesseract-ocr-eng
      - run: python3 -m pip install 'pymupdf>=1.24,<1.28'
      - run: python3 scripts/ocr_m04_probe.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/analysis/m04-ocr-samples.json
          git diff --cached --quiet || (git commit -m 'Inspect Persian OCR samples for chapter 4' && git push)
