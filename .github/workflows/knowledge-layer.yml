name: Build structured regulation knowledge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/knowledge-layer.yml"

permissions:
  contents: write

concurrency:
  group: knowledge-layer-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild current page indexes
        run: python3 scripts/build_draft_index.py
      - name: Build clause-level structured knowledge
        run: python3 scripts/build_knowledge.py
      - name: Test ontology, source links and retrieval
        run: |
          python3 -m unittest discover -s tests -p 'test_knowledge.py' -v
          node --check frontend/app.js
          node tests/knowledge-search.test.cjs
      - name: Commit generated knowledge shards
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/data/knowledge/ frontend/data/draft/
          if ! git diff --staged --quiet; then
            git commit -m "Build structured regulation knowledge from current PDF corpus [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Confirm no public deployment
        run: echo "Knowledge generated and tested; GitHub Pages deployment remains disabled."
