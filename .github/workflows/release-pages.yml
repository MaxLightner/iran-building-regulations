name: Publish regulations preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/m01-1392/**"
      - "data/catalog.json"
      - "data/m02-1384/**"
      - "data/m04-1396/**"
      - "data/m05-1396/**"
      - "scripts/validate_release.py"
      - "scripts/smoke_frontend.mjs"
      - ".github/workflows/release-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Bundle inspected regulation data
        run: |
          python3 scripts/validate_release.py
          node scripts/smoke_frontend.mjs
          mkdir -p frontend/data
          cp data/catalog.json frontend/data/catalog.json
          for book in m01-1392 m04-1396 m05-1396; do
            cp -r "data/$book" "frontend/data/$book"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
