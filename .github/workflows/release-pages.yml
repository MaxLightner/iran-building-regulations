name: Publish regulations preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/m01-1392/**"
      - "data/catalog.json"
      - "data/m02-1384/**"
      - ".github/workflows/release-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Bundle inspected regulation data
        run: |
          mkdir -p frontend/data/m01-1392
          cp data/catalog.json frontend/data/catalog.json
          cp data/m01-1392/sections.json frontend/data/m01-1392/sections.json
          cp data/m01-1392/coverage.json frontend/data/m01-1392/coverage.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
