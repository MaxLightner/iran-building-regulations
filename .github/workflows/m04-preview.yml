name: Build M04 rule preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m04-preview.yml"
      - "scripts/build_m04_preview.py"
      - "tests/test_m04_preview.py"
      - "tests/m04-preview.test.cjs"
      - "frontend/m04-preview/index.html"
      - "frontend/m04-preview/app.js"
      - "frontend/m04-preview/styles.css"

permissions:
  contents: write

concurrency:
  group: m04-preview-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fas tesseract-ocr-eng
          python3 -m pip install "pymupdf>=1.24,<1.28"
      - name: Build high-quality M04 rule database
        run: python3 -u scripts/build_m04_preview.py
      - name: Validate rule extraction and user queries
        run: |
          python3 -m unittest discover -s tests -p 'test_m04_preview.py' -v
          node --check frontend/m04-preview/app.js
          node tests/m04-preview.test.cjs
      - name: Commit preview data only after benchmark passes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/m04-preview/data/rules.json
          if ! git diff --staged --quiet; then
            git commit -m "Build benchmarked M04 rule preview"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
