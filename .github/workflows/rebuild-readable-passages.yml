name: Rebuild readable regulatory passages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/rebuild_readable_passages.py"
      - ".github/workflows/rebuild-readable-passages.yml"
      - "frontend/data/submitted/**"
      - "frontend/data/chapters/**"
permissions:
  contents: write
concurrency:
  group: readable-passages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/rebuild_readable_passages.py
      - name: Check no character-based cuts or invented paragraph clause IDs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path("frontend/data/clause-text")
          m=json.loads((d/"readable-manifest.json").read_text())
          assert len(m["chapters"])==10
          for n,s in m["chapters"].items():
              rows=json.loads((d/f'm{int(n):02d}-readable.json').read_text())["records"]
              assert len(rows)==s["readable_passages"]
              assert all(r["kind"]=="readable_paragraph" and r["locator"] is None for r in rows)
              assert all(not __import__("re").match(r"^صفحه\\s*\\d+\\s*-\\s*بخش\\s*\\d+", r["title"]) for r in rows)
              assert all(len(r["answer"])>=48 for r in rows)
          print("PASS",m["total_passages"],"complete-sentence passages")
          PY
      - name: Commit full readable text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/data/clause-text
          if ! git diff --staged --quiet; then
            git commit -m "Replace broken page fragments with complete-sentence passages"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
