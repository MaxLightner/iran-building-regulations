name: Rebuild one regulation chapter

on:
  workflow_dispatch:
    inputs:
      chapter:
        description: "Chapter number to rebuild (1-24)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CHAPTER: "${{ inputs.chapter }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate chapter number
        shell: bash
        run: |
          if ! [[ "$CHAPTER" =~ ^([1-9]|1[0-9]|2[0-4])$ ]]; then
            echo "Chapter must be 1..24" >&2
            exit 2
          fi
      - name: Install OCR and PDF parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fas tesseract-ocr-eng
          python3 -m pip install "pymupdf>=1.24,<1.28"
      - name: Re-extract selected chapter
        run: python3 -u scripts/extract_batch_pages.py --chapters "$CHAPTER"
      - name: Rebuild complete search and project indexes
        run: |
          python3 scripts/build_static.py
          python3 scripts/build_draft_index.py
          python3 scripts/build_knowledge.py
          python3 scripts/build_applicability.py
      - name: Run full regression and benchmark
        run: |
          python3 -m unittest discover -s tests -p "test_all24.py" -v
          python3 -m unittest discover -s tests -p "test_knowledge.py" -v
          python3 -m unittest discover -s tests -p "test_applicability.py" -v
          node --check frontend/app.js
          node tests/knowledge-search.test.cjs
          node tests/project-fit.test.cjs
          node tests/search-benchmark.test.cjs
      - name: Commit refreshed chapter and rebuilt indexes
        shell: bash
        run: |
          id=$(printf "m%02d" "$CHAPTER")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/extracted/$id/pages" "data/analysis/$id-quality.json" frontend/data/
          if ! git diff --staged --quiet; then
            git commit -m "Refresh regulation chapter $CHAPTER and rebuild search indexes [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
