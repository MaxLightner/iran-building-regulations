name: Complete phase 3 - all remaining chapters and unified knowledge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-complete.yml"

permissions:
  contents: write

concurrency:
  group: phase3-complete-main
  cancel-in-progress: false

jobs:
  extract:
    name: Extract batch \${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a
            chapters: "1 2 8 11"
          - name: b
            chapters: "12 13 14 16"
          - name: c
            chapters: "17 18 19 20"
          - name: d
            chapters: "21 22 23 24"
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR and PDF parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fas tesseract-ocr-eng
          python3 -m pip install 'pymupdf>=1.24,<1.28'
      - name: Extract every page in this batch
        shell: bash
        run: python3 -u scripts/extract_batch_pages.py --chapters \${{ matrix.chapters }}
      - name: Package only this batch outputs
        shell: bash
        run: |
          mkdir -p batch-out/data/extracted batch-out/data/analysis
          for n in \${{ matrix.chapters }}; do
            id=$(printf "m%02d" "$n")
            cp -a "data/extracted/$id" "batch-out/data/extracted/$id"
            cp "data/analysis/$id-quality.json" "batch-out/data/analysis/$id-quality.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-\${{ matrix.name }}
          path: batch-out/
          if-no-files-found: error
          compression-level: 6

  merge-test-commit:
    name: Merge all remaining chapters, build knowledge, test and commit
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: phase3-*
          path: merged
          merge-multiple: true
      - name: Merge extracted batches into repository workspace
        run: |
          cp -a merged/data/extracted/. data/extracted/
          cp -a merged/data/analysis/. data/analysis/
      - name: Build page index and unified 24-chapter knowledge
        run: |
          python3 scripts/build_static.py
          python3 scripts/build_draft_index.py
          python3 scripts/build_knowledge.py
      - name: Acceptance tests for all 24 chapters and browser retrieval
        run: |
          python3 -m unittest discover -s tests -p 'test_all24.py' -v
          python3 -m unittest discover -s tests -p 'test_draft_index.py' -v
          python3 -m unittest discover -s tests -p 'test_knowledge.py' -v
          node --check frontend/app.js
          node tests/draft-search.test.cjs
          node tests/knowledge-search.test.cjs
      - name: Commit all completed phase-3 data in one commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/extracted/ data/analysis/ frontend/data/
          if ! git diff --staged --quiet; then
            git commit -m "Complete phase 3: all 24 chapters searchable as structured knowledge [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Confirm publication still deferred
        run: echo "All phase-3 data built and tested. No GitHub Pages deployment in this workflow."
