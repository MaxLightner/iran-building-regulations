name: Build Phase 1 text database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/chapters.json"
      - "sources/text-source-inventory.json"
      - "scripts/build_phase1_text_database.py"
      - ".github/workflows/build-phase1-text.yml"
      - "frontend/data/chapters/**"
      - "frontend/data/submitted/**"
      - "frontend/data/catalog.json"
      - "frontend/data/m19-structured-backup.json"

permissions:
  contents: write

concurrency:
  group: text-phase1
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build versioned own-repository full text
        run: |
          python3 -m py_compile scripts/build_phase1_text_database.py
          python3 -u scripts/build_phase1_text_database.py
      - name: Validate every chapter and version
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path("frontend/data/text-phase1")
          manifest=json.loads((base/"manifest.json").read_text())
          assert len(manifest["chapters"])==24
          total=0
          for c in manifest["chapters"]:
              path=base/"chapters"/f'm{c["chapter"]:02d}.json'
              doc=json.loads(path.read_text(encoding="utf-8"))
              assert doc["chapter"]==c["chapter"]
              assert doc["target_edition"]==c["target_edition"]
              for version in doc["versions"]:
                  assert all(r["edition"]==version["edition"] for r in version["records"])
                  assert all(r["kind"]!="ocr_page" for r in version["records"])
                  assert version["record_count"]==len(version["records"])
                  total+=version["record_count"]
          assert total==manifest["total_stored_rows_including_historical_editions"]
          assert total>=4500
          print("Phase 1 stored rows:",total)
          print("Target editions with readable text:",manifest["target_editions_with_any_readable_text"])
          print("Missing target editions:",manifest["target_editions_missing_text"])
          PY
      - name: Commit independent versioned text dataset
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/data/text-phase1
          if ! git diff --staged --quiet; then
            git commit -m "Refresh Phase 1 versioned text database"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
