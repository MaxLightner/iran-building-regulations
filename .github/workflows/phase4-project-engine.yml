name: Build phase 4 project relevance engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase4-project-engine.yml"

permissions:
  contents: write

concurrency:
  group: phase4-project-engine-main
  cancel-in-progress: true

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild structured knowledge
        run: |
          python3 scripts/build_draft_index.py
          python3 scripts/build_knowledge.py
      - name: Build project relevance signal index
        run: python3 scripts/build_applicability.py
      - name: Test project engine and browser integration
        run: |
          python3 -m unittest discover -s tests -p 'test_applicability.py' -v
          python3 -m unittest discover -s tests -p 'test_all24.py' -v
          node --check frontend/app.js
          node tests/knowledge-search.test.cjs
          node tests/project-fit.test.cjs
      - name: Commit project relevance index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/data/applicability/ frontend/data/knowledge/ frontend/data/draft/
          if ! git diff --staged --quiet; then
            git commit -m "Phase 4: rank regulation knowledge by project profile [skip ci]"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Confirm Pages remains deferred
        run: echo "Project engine built and tested. No GitHub Pages deployment in this workflow."
